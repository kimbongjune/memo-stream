<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>Memo Stream</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <div id="app">
      <header id="header">
        <button id="folder-btn" class="folder-btn" title="폴더 선택">
          <span id="folder-name">Inbox</span>
          <svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="header-actions">
          <button id="search-toggle" class="icon-btn" title="검색">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button id="settings-btn" class="icon-btn" title="설정">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.5" fill="var(--bg)"/><circle cx="15" cy="17" r="2.5" fill="var(--bg)"/></svg>
          </button>
        </div>
      </header>

      <div id="folder-menu" class="menu hidden">
        <button class="menu-item" data-nav="all">
          <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          <span>전체</span>
        </button>
        <div class="menu-divider"></div>
        <div id="folder-list" class="folder-list"></div>
        <div class="menu-divider"></div>
        <button class="menu-item" data-nav="trash">
          <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 6V4h4v2"/></svg>
          <span>휴지통</span>
        </button>
        <div class="menu-divider"></div>
        <div class="new-folder-row">
          <input id="new-folder-input" type="text" maxlength="50" placeholder="새 폴더 이름">
          <button id="new-folder-btn" class="icon-btn" title="폴더 만들기">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>

      <div id="search-bar" class="hidden">
        <div class="search-row">
          <input id="search-input" type="text" autocomplete="off" placeholder="메모 검색...">
          <label class="search-scope" title="모든 폴더에서 검색">
            <input type="checkbox" id="search-global" checked>
            <span>전체</span>
          </label>
          <button id="search-close" class="icon-btn" title="검색 닫기">
            <svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div id="search-filters" class="search-filters">
          <button class="filter-chip active" data-kind="">전체</button>
          <button class="filter-chip" data-kind="image">사진</button>
          <button class="filter-chip" data-kind="video">동영상</button>
          <button class="filter-chip" data-kind="file">파일</button>
        </div>
      </div>

      <main id="main">
        <div id="note-list" class="note-list"></div>
        <div id="settings-view" class="settings-view hidden"></div>
        <div id="trash-view" class="trash-view hidden"></div>
      </main>

      <footer id="input-area">
        <div id="input-status" class="input-status hidden"></div>
        <div id="attach-strip" class="attach-strip hidden"></div>
        <div class="input-row">
          <textarea id="note-input" rows="2" placeholder="메모를 적어보세요..."></textarea>
          <button id="send-btn" class="send-btn" title="전송">
            <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
      </footer>
    </div>

    <div id="note-menu" class="menu floating hidden"></div>

    <div id="dialog-overlay" class="dialog-overlay hidden">
      <div id="dialog" class="dialog"></div>
    </div>

    <div id="toast" class="toast"></div>

    <div id="onboarding" class="dialog-overlay hidden">
      <div class="dialog onboarding-dialog">
        <h2>환영합니다</h2>
        <p class="onboarding-local">메모는 이 브라우저에 저장됩니다. 설정에서 동기화를 켜면 본인의 Supabase 프로젝트로 다른 PC와 이어집니다.</p>
        <ul class="onboarding-tips">
          <li>메모는 폴더에 시간순으로 쌓입니다</li>
          <li>텍스트를 선택하고 오른쪽 버튼을 누르면 메모로 저장됩니다</li>
          <li>이미지, 동영상, 파일을 붙여넣으면 그대로 첨부됩니다</li>
          <li>동기화를 쓰지 않는다면 설정에서 가끔 내보내기를 해두세요</li>
        </ul>
        <div class="dialog-actions">
          <button id="onboarding-ok" class="btn primary">시작하기</button>
        </div>
      </div>
    </div>

    <script src="lib/dexie.min.js"></script>
    <script src="lib/marked.min.js"></script>
    <script src="lib/purify.min.js"></script>
    <script src="lib/fflate.min.js"></script>
    <script src="db.js"></script>
    <script src="hash.js"></script>
    <script src="markdown.js"></script>
    <script src="storage.js"></script>
    <script src="backup.js"></script>
    <script src="video.js"></script>
    <script src="supabase.js"></script>
    <script src="sync.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
